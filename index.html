<!doctype html><html lang="sr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dispatch English Coach</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1426;color:#eaf2ff;font:16px system-ui}main{max-width:720px;margin:auto;padding:20px}h1{font-size:27px}h2{font-size:19px}.card{background:#17243d;border:1px solid #354562;border-radius:18px;padding:18px;margin:14px 0}.muted{color:#a8b8d2}button{background:#65d5b7;border:0;border-radius:11px;padding:12px 16px;font-weight:700;margin:4px 5px 4px 0;color:#06271f}button.alt{background:#304461;color:white}select,textarea{display:block;width:100%;background:#101d32;color:white;border:1px solid #536785;border-radius:10px;padding:12px;margin:10px 0;font:inherit}textarea{height:110px}.bar{height:8px;background:#31415e;border-radius:8px;overflow:hidden}.bar div{height:100%;background:#65d5b7}.note{white-space:pre-line}small{color:#9fafc8}</style>
<main><small>🇺🇸 US TRUCKING · BEGINNER</small><h1>Dispatch English Coach</h1><p class="muted">Vežbaj 10–15 minuta dnevno. Jasno i profesionalno.</p>
<section class="card"><h2>Izaberi vežbu</h2><select id="topic"></select><select id="duration"><option value="10">10 minuta</option><option value="15">15 minuta</option></select><button id="start">Počni</button><button class="alt" id="shift">Simulacija smene 16–23h</button><p id="timer" class="muted"></p></section>
<section class="card"><small id="mode">Lekcija</small><h2 id="prompt"></h2><p id="tip" class="muted"></p><textarea id="answer" placeholder="Napiši ili izgovori odgovor na engleskom"></textarea><button class="alt" id="mic">🎤 Govori</button><button id="check">Proveri</button><button class="alt" id="next">Sledeće</button><div id="feedback" class="note"></div></section>
<section class="card"><h2>Napredak</h2><div id="progress"></div><button class="alt" id="clear">Obriši napredak</button></section><small>Napredak se čuva na ovom uređaju. Provera je okvirna tekstualna procena, ne AI ocena gramatike ili izgovora. Mikrofon zavisi od pregledača.</small></main>
<script>
const lessons=[
["Predstavljanje i iskustvo","Tell me about your work experience.","I lead a team of twelve people in production. I organize work and meet deadlines.","Kratko predstavi iskustvo i odgovornosti."],
["Vozač","Driver: I'm stuck in traffic. What should I do?","Please send your updated ETA. I will inform the broker.","Traži novi ETA i obavesti brokera."],
["Broker","Broker: Is your truck empty and available?","Yes, the truck is empty and ready for pickup.","Potvrdi da je kamion prazan i spreman."],
["Shipper","Shipper: Do you have a pickup number?","Yes, our pickup number is 45821. Could you confirm the appointment?","Navedi broj i proveri termin."],
["Pregovaranje o ceni","Broker: I can pay $1,500. Can you take it?","Could you do $1,700? We can pick up today.","Ljubazno ponudi drugu cenu."],
["Empty miles","The truck is 65 miles away. Explain the deadhead.","We have 65 empty miles to pickup. Our ETA is 3 PM.","Empty miles ili deadhead znači prazne milje."],
["Pickup / delivery","Can you deliver Friday at 9 AM?","Let me check the driver's hours and confirm the ETA.","Ne obećavaj termin pre provere."],
["Vremenske zone","Confirm pickup at 2 PM Central Time.","I confirm pickup at 2 PM Central Time.","Uvek reci vremensku zonu: ET, CT, MT ili PT."],
["Skraćenice država","What do TX, IL and CA stand for?","Texas, Illinois and California.","TX = Texas, IL = Illinois, CA = California."],
["Problem pod pritiskom","Driver: My truck broke down. Delivery is in four hours.","Are you safe? Send your location and repair ETA. I will update the broker.","Prvo bezbednost, lokacija i ETA, zatim broker."]
];let idx=0,shift=false,until=0,interval;const $=x=>document.getElementById(x),stats=JSON.parse(localStorage.getItem('dec-progress')||'{}');
$('topic').innerHTML=lessons.map((x,i)=>'<option value="'+i+'">'+x[0]+'</option>').join('');
function display(){const l=lessons[idx];$('topic').value=idx;$('mode').textContent=shift?'Simulacija popodnevne smene':'Lekcija '+(idx+1)+'/10';$('prompt').textContent=l[1];$('tip').textContent=l[3];$('answer').value='';$('feedback').textContent=''}
function progress(){ $('progress').innerHTML=lessons.map((l,i)=>{const s=stats[i]||{n:0,best:0};return '<p>'+l[0]+' · '+s.n+' vežbi · '+s.best+'/10</p><div class="bar"><div style="width:'+s.best*10+'%"></div></div>'}).join('')}
function begin(s){shift=s;if(s)idx=1;until=Date.now()+Number($('duration').value)*60000;clearInterval(interval);interval=setInterval(()=>{let n=Math.max(0,Math.ceil((until-Date.now())/1000));$('timer').textContent=n?'Preostalo '+Math.floor(n/60)+':'+String(n%60).padStart(2,'0'):'Sesija završena';if(!n)clearInterval(interval)},1000);display()}
$('start').onclick=()=>begin(false);$('shift').onclick=()=>begin(true);$('topic').onchange=e=>{idx=+e.target.value;shift=false;display()};$('next').onclick=()=>{idx=(idx+1)%lessons.length;display()};
$('check').onclick=()=>{let a=$('answer').value.trim();if(!a){$('feedback').textContent='Prvo napiši odgovor.';return}const l=lessons[idx],w=a.toLowerCase().match(/[a-z]+/g)||[],t=l[2].toLowerCase().match(/[a-z]+/g)||[];let overlap=t.filter(x=>w.includes(x)).length;let score=Math.min(10,Math.max(2,Math.round(3+7*overlap/t.length)));let s=stats[idx]||{n:0,best:0};s.n++;s.best=Math.max(score,s.best);stats[idx]=s;localStorage.setItem('dec-progress',JSON.stringify(stats));progress();$('feedback').innerHTML='<hr><p><b>Prirodniji primer:</b> '+l[2]+'</p><p><b>Okvirna razumljivost:</b> '+score+'/10</p><p><b>Objašnjenje:</b> '+l[3]+'</p><button class="alt" id="listen">🔊 Poslušaj</button>';$('listen').onclick=()=>{let u=new SpeechSynthesisUtterance(l[2]);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}};
$('mic').onclick=()=>{const ios=/iPad|iPhone|iPod/.test(navigator.userAgent);if(ios){$('answer').focus();$('feedback').textContent='Na iPhone-u koristi mikrofon na Apple tastaturi (diktiranje). Safari prepoznavanje govora može da se zaglavi; zato ga ovde ne pokrećemo.';return}const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('answer').focus();$('feedback').textContent='Prepoznavanje govora nije podržano. Koristi mikrofon na tastaturi.';return}const button=$('mic');let rec;try{rec=new R();rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=1;button.disabled=true;button.textContent='🎤 Slušam...';const done=()=>{button.disabled=false;button.textContent='🎤 Govori'};rec.onresult=e=>{$('answer').value=e.results[0][0].transcript;done()};rec.onerror=e=>{done();$('feedback').textContent='Mikrofon nije dostupan ('+e.error+'). Koristi diktiranje na tastaturi.'};rec.onend=done;rec.start();setTimeout(()=>{try{rec.abort()}catch(e){}done()},12000)}catch(e){button.disabled=false;button.textContent='🎤 Govori';$('feedback').textContent='Nije moguće pokrenuti mikrofon. Koristi diktiranje na tastaturi.'}};
$('clear').onclick=()=>{if(confirm('Obrisati napredak?')){Object.keys(stats).forEach(k=>delete stats[k]);localStorage.removeItem('dec-progress');progress()}};display();progress();
</script></html>
